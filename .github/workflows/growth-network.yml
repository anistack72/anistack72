name: Account network API
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: account-network-api
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'anistack72/anistack72' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: automation/growth
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python security_check.py
  execute:
    needs: verify
    if: github.repository == 'anistack72/anistack72' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        working-directory: automation/growth
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Enforce campaign window
        id: window
        run: |
          python - <<'PY'
          import datetime,json,os
          p=json.load(open('network-policy.json'))
          enabled=datetime.datetime.now(datetime.timezone.utc).date().isoformat() <= p['campaign_end']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('enabled='+str(enabled).lower()+'\n')
          PY
      - name: Check account credential availability
        id: credential
        if: steps.window.outputs.enabled == 'true'
        env:
          FOLLOWER_TOKEN: ${{ secrets.FOLLOWER_TOKEN }}
        run: |
          python - <<'PY'
          import os
          ready=bool(os.environ.get('FOLLOWER_TOKEN'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('ready='+str(ready).lower()+'\n')
          if not ready:
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('Credential required: FOLLOWER_TOKEN with user Followers read/write permission. No account mutation ran.\n')
              print('::warning::FOLLOWER_TOKEN is missing; API execution is not active.')
          PY
      - name: Execute account policy with durable reservations
        if: steps.window.outputs.enabled == 'true' && steps.credential.outputs.ready == 'true'
        env:
          FOLLOWER_TOKEN: ${{ secrets.FOLLOWER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m growth.network_api --apply --state "$RUNNER_TEMP/network-api.sqlite3"
      - name: Preserve sanitized execution report
        if: always() && steps.credential.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: account-network-report
          path: automation/growth/var/network-api-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish execution summary
        if: always() && steps.credential.outputs.ready == 'true'
        run: |
          if [ -f var/network-api-report.json ]; then
            cat var/network-api-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
