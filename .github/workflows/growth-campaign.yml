name: Evidence-led growth campaign
on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['automation/growth/**', '.github/workflows/growth-campaign.yml']
permissions:
  contents: read
concurrency:
  group: github-growth-campaign
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'anistack72/anistack72'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      saved: ${{ steps.artifact.outputs.artifact-id }}
    defaults:
      run:
        working-directory: automation/growth
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Regression and source-security gate
        run: |
          python -m unittest discover -s tests -v
          python security_check.py
      - name: Enforce campaign window
        id: window
        run: |
          python - <<'PY'
          import datetime, json, os
          from growth.campaign import phase
          config = json.load(open('config.json'))
          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          enabled = phase(today, config['campaign_start'], config['campaign_end']) not in ('not_started', 'finished')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write('enabled=' + str(enabled).lower() + '\n')
          PY
      - name: Restore durable data checkpoint
        if: steps.window.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/reports
          result=0
          git ls-remote --exit-code --heads origin growth-data > "$RUNNER_TEMP/growth-remote" || result=$?
          if [ "$result" -eq 0 ]; then
            git fetch --depth=1 origin refs/heads/growth-data
            git show FETCH_HEAD:state.sqlite3 > var/state.sqlite3
            test -s var/state.sqlite3
          elif [ "$result" -ne 2 ]; then
            exit "$result"
          fi
      - name: Collect, score, draft and verify evidence
        id: collector
        if: steps.window.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m growth.cli --state var/state.sqlite3 --output var/reports
      - name: Preserve checkpoints and diagnostics on failure
        id: artifact
        if: always() && steps.window.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: growth-checkpoint
          path: automation/growth/var/
          if-no-files-found: error
          retention-days: 45
      - name: Write execution summary
        if: always() && steps.window.outputs.enabled == 'true'
        run: |
          if [ -f var/reports/brief.md ]; then
            cat var/reports/brief.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Collector incomplete. Inspect structured logs and checkpoint; no growth result is claimed.' >> "$GITHUB_STEP_SUMMARY"
          fi
  persist:
    needs: collect
    if: always() && needs.collect.outputs.saved != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: growth-checkpoint
          path: ${{ runner.temp }}/growth-checkpoint
      - name: Commit generated state on isolated branch
        shell: bash
        run: bash automation/growth/persist.sh
